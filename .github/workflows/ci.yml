name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: macOS · Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev,gui]"

      - name: Check public repository contents
        run: python scripts/check_public_repo.py

      - name: Run test suite
        run: python -m pytest

      - name: Build source and wheel distributions
        run: python -m build

  swift-integration:
    name: macOS · Swift Screenshot Intelligence
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python helper
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python file-operation helper
        run: python -m pip install -e .

      - name: Run Swift self-test and Python-helper integration
        working-directory: swift/ScreenshotIntelligence
        run: |
          FROGANIZE_E2E_HELPER="$(command -v froganize-fileops)" \
            swift run --disable-sandbox ScreenshotRenamerSelfTest

      - name: Check Keychain access policy
        working-directory: swift/ScreenshotIntelligence
        run: ./Scripts/check-keychain-access-policy.sh
